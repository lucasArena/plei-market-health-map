name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      vercel-environment:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      IS_PRODUCTION: ${{ inputs.vercel-environment == 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:deploy
      - run: pnpm add --global vercel@60.1.3
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ inputs.vercel-environment }} --token="$VERCEL_TOKEN"
      - name: Build
        run: |
          args=(--token="$VERCEL_TOKEN")
          if [ "$IS_PRODUCTION" = "true" ]; then args+=(--prod); fi
          vercel build "${args[@]}"
      - name: Deploy
        id: deploy
        run: |
          args=(--prebuilt --token="$VERCEL_TOKEN")
          if [ "$IS_PRODUCTION" = "true" ]; then args+=(--prod); fi
          url=$(vercel deploy "${args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Alias staging domain
        if: inputs.environment == 'staging' && vars.STAGING_DOMAIN != ''
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "${{ vars.STAGING_DOMAIN }}" --token="$VERCEL_TOKEN"
