name: Linear sync

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
    branches: [staging]

permissions:
  contents: read
  pull-requests: read

jobs:
  opened-to-staging:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
      TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Move the ticket to Code Review
        run: node .github/scripts/linear/move-issues.mjs "Code Review" "$TITLE" "$HEAD_REF" --skip-from Done,Released,Canceled

  changes-requested:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    env:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
      TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Move the ticket to Feedback
        run: node .github/scripts/linear/move-issues.mjs Feedback "$TITLE" "$HEAD_REF" --skip-from Done,Released,Canceled

  merged-to-staging:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
      TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ github.token }}
      PULL_REQUEST: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read every commit title in the pull request and the pull requests they reference
        run: |
          titles=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits" --jq '.[].commit.message | split("\n")[0]')
          stacked=""
          for number in $(grep -oE '#[0-9]+' <<< "$titles" | tr -d '#' | sort -u); do
            stacked+=$'\n'$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.title + " " + .head.ref' 2>/dev/null || true)
          done
          {
            echo "COMMIT_TITLES<<COMMIT_TITLES_END"
            echo "$titles$stacked"
            echo "COMMIT_TITLES_END"
          } >> "$GITHUB_ENV"
      - name: Move the tickets to Done
        run: node .github/scripts/linear/move-issues.mjs Done "$TITLE" "$HEAD_REF" "$COMMIT_TITLES" --skip-from Released,Canceled
