name: CD production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/_release.yml
    with:
      branch: main
    secrets: inherit

  deploy:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      environment: production
      vercel-environment: production
      ref: ${{ needs.release.outputs.tag || github.sha }}
    secrets: inherit

  linear-release:
    needs: [release, deploy]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write the release notes from the commits since the last tag
        id: notes
        run: |
          summary=$(node .github/scripts/release/release-notes.mjs "$TAG" release-notes.md changelog.md)
          echo "$summary"
          echo "previous-tag=$(echo "$summary" | jq -r '.previousTag // empty')" >> "$GITHUB_OUTPUT"
          echo "issues=$(echo "$summary" | jq -r '.issues | join(" ")')" >> "$GITHUB_OUTPUT"
          echo "flagged=$(echo "$summary" | jq -r '.flagged | join(" ")')" >> "$GITHUB_OUTPUT"
          cat release-notes.md changelog.md >> "$GITHUB_STEP_SUMMARY"
      - name: Warn when Linear is not configured
        if: env.LINEAR_ACCESS_KEY == ''
        run: echo "::warning::LINEAR_ACCESS_KEY is not set, so $TAG was not sent to Linear."
      - name: Create the release in Linear
        id: linear
        if: env.LINEAR_ACCESS_KEY != ''
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: Market Health Map ${{ env.TAG }}
          version: ${{ env.TAG }}
          base_ref: ${{ steps.notes.outputs.previous-tag }}
          release_notes: release-notes.md
          documents: Changelog ${{ env.TAG }}=changelog.md
          links: ${{ github.server_url }}/${{ github.repository }}/tree/${{ env.TAG }}
      - name: Link the released tickets and drop feature-flagged ones
        if: steps.linear.outputs.release-id != ''
        env:
          ISSUES: ${{ steps.notes.outputs.issues }}
        run: node .github/scripts/linear/flagged-issues.mjs sync "${{ steps.linear.outputs.release-id }}" "$ISSUES"
      - name: Link the Linear release
        if: steps.linear.outputs.release-url != ''
        env:
          FLAGGED: ${{ steps.notes.outputs.flagged }}
        run: |
          echo "Linear release ${{ steps.linear.outputs.release-url }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FLAGGED" ]; then echo "Behind feature flags, left out: $FLAGGED" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Move the released tickets to Released
        if: steps.notes.outputs.issues != ''
        env:
          ISSUES: ${{ steps.notes.outputs.issues }}
        run: node .github/scripts/linear/move-issues.mjs Released "$ISSUES"
