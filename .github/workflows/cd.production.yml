name: CD production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/_release.yml
    with:
      channel: production
      branch: main
    secrets: inherit

  deploy:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      environment: production
      vercel-environment: production
      ref: ${{ needs.release.outputs.tag || github.sha }}
    secrets: inherit
