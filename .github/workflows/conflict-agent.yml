name: Conflict agent

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: conflict-agent
  cancel-in-progress: false

jobs:
  hand-conflicts-to-agent:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
      LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
      LINEAR_FIX_AGENT_ID: ${{ vars.LINEAR_FIX_AGENT_ID }}
      LINEAR_AGENT_API_KEY: ${{ secrets.LINEAR_AGENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hand newly conflicting PRs to the fix agent
        run: node .github/scripts/linear/delegate-conflicts.mjs
