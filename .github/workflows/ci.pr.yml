name: CI pull request

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^release/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]] && [ "$BASE_REF" = "main" ]; then
            echo "Promotion of $HEAD_REF to main."
            exit 0
          fi
          if [ "$HEAD_REF" = "main" ] && [ "$BASE_REF" = "staging" ]; then
            echo "Back-merge from main to staging."
            exit 0
          fi
          if [[ "$HEAD_REF" =~ ^(hotfix|feature|refactor|chore)/[a-z0-9._-]+$ ]]; then
            echo "Branch $HEAD_REF follows the naming pattern."
            exit 0
          fi
          echo "::error::Branch '$HEAD_REF' must match hotfix/*, feature/*, refactor/* or chore/* (lowercase, digits, . _ -), or release/YYYY-MM-DD-N into main."
          exit 1

  linear-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Linear issue in the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "staging" ]; then
            echo "Promotion from staging to main."
            exit 0
          fi
          if [[ "$TITLE" =~ [A-Z][A-Z0-9]{1,9}-[0-9]+ ]]; then
            echo "Linked to ${BASH_REMATCH[0]}."
            exit 0
          fi
          echo "::warning::Add the Linear issue to the PR title, e.g. 'feat(map): add panel (ENG-5758)', so the production release links it in Linear."

  unit-tests:
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:scripts
