name: CI pull request

on:
  pull_request:
    branches: [staging, main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HEAD_REF" = "staging" ] && [ "$BASE_REF" = "main" ]; then
            echo "Promotion from staging to main."
            exit 0
          fi
          if [[ "$HEAD_REF" =~ ^(hotfix|feature|refactor|chore)/[a-z0-9._-]+$ ]]; then
            echo "Branch $HEAD_REF follows the naming pattern."
            exit 0
          fi
          echo "::error::Branch '$HEAD_REF' must match hotfix/*, feature/*, refactor/* or chore/* (lowercase, digits, . _ -)."
          exit 1

  unit-tests:
    runs-on: ubuntu-latest
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:scripts
