name: CD staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      channel: staging
      branch: staging
    secrets: inherit

  deploy:
    needs: release
    uses: ./.github/workflows/_deploy-vercel.yml
    with:
      environment: staging
      vercel-environment: preview
      ref: ${{ needs.release.outputs.tag || github.sha }}
    secrets: inherit
